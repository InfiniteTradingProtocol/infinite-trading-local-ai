name: build

# Every push/PR: tests + build. A v* tag: build on GitHub's runner, attest the DMG
# (Sigstore build provenance: which commit and workflow produced it) and publish a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write      # create the release (tags only)
      id-token: write      # Sigstore signing for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "swift=$(xcrun swiftc --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Recommendation tests
        run: |
          mkdir -p build
          xcrun swiftc -swift-version 5 mac/Sources/Catalog.swift mac/Sources/Speed.swift tests/recommend/main.swift -o build/recommend-test
          build/recommend-test

      - name: Build app and DMG
        run: bash mac/build.sh

      - name: Hashes
        id: hashes
        run: |
          dmg=$(ls dist/*.dmg | grep -vE -- '-(apple-silicon|intel)\.dmg$')
          exe="build/Infinite Agent Manager.app/Contents/MacOS/InfiniteAgentManager"
          (cd dist && shasum -a 256 *.dmg) > SHA256SUMS
          for arch in arm64 x86_64; do
            lipo -thin "$arch" "$exe" -output "n-$arch"
            codesign --force --sign - "n-$arch" && codesign --remove-signature "n-$arch"
            echo "$(python3 -I scripts/normalize-macho.py "n-$arch")  InfiniteAgentManager ($arch, normalized)" >> SHA256SUMS
          done
          cat SHA256SUMS
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: InfiniteAgentManager-${{ github.sha }}
          path: |
            dist/*.dmg
            SHA256SUMS

      # GitHub only stores attestations for public repositories on our plan;
      # while the repo is private, releases ship with SHA-256 and verify.sh only.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="${{ steps.hashes.outputs.dmg }}"
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            attest="# Build-provenance attestation: not available while the repository is private"
          else
            attest="gh attestation verify $(basename "$dmg") --repo ${GITHUB_REPOSITORY}   # proves this workflow built it from this commit"
          fi
          cat > notes.md <<NOTES
          Built by GitHub Actions from commit [\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) ([workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).

          **Universal DMG SHA-256:** \`${{ steps.hashes.outputs.sha }}\` (Apple Silicon and Intel). Smaller single-architecture DMGs, \`-apple-silicon\` and \`-intel\`, are listed in SHA256SUMS below.

          Toolchain: ${{ steps.toolchain.outputs.xcode }} · ${{ steps.toolchain.outputs.swift }}

          ### Verify
          \`\`\`sh
          shasum -a 256 $(basename "$dmg")     # must match the SHA-256 above
          ${attest}
          git checkout ${GITHUB_REF_NAME} && bash scripts/verify.sh $(basename "$dmg")   # rebuild from source and compare
          \`\`\`
          The app is ad-hoc signed (not notarized): on first open, right-click → Open. See CHANGELOG.md for what changed.

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.dmg SHA256SUMS --title "Infinite Agent Manager ${GITHUB_REF_NAME#v}" --notes-file notes.md
